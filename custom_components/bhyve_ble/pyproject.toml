[project]
name = "pybhyve"
version = "0.1.0"
description = "Orbit B-hyve hose timer BLE library and CLI"
readme = "pybhyve/README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "bleak>=0.19.0",
    "protobuf>=6.32.0",
    "pycryptodome>=3.19.0",
]

[project.scripts]
bhyve = "pybhyve.cli.main:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pybhyve"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
