# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py314"

# Protobuf/gRPC generated modules are not maintained by hand.
extend-exclude = ["*_pb2.py"]

line-length = 100

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
    # Custom integration / Home Assistant patterns (docstrings, lazy imports, override signatures)
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D107",
    "PLR2004",
    "E501",
    "PLC0415",
    "N806",
    "ASYNC109",
    "SIM105",
    "S110",
    "ARG002",
    "ARG004",
    "ANN001",
    "ANN003",
    "ANN202",
    "TRY300",
    "PLR0911",
    "PLR0912",
    "PERF401",
    "TID252", # vendored pybhyve package uses relative imports
    "TRY003",
    "EM101",
    "EM102",
    "BLE001",
    "PLR0913",
]

[lint.per-file-ignores]
"custom_components/bhyve_ble/const.py" = ["E402"]
"custom_components/bhyve_ble/aes_handshake.py" = ["FBT001", "FBT002"]
"custom_components/bhyve_ble/pybhyve/ble_trace.py" = ["TC001"]
"custom_components/bhyve_ble/pybhyve/cli/display.py" = ["T201", "TC001"]
"custom_components/bhyve_ble/pybhyve/cli/main.py" = ["T201", "C901", "PLR0915", "S101"]
"custom_components/bhyve_ble/pybhyve/link_crypto.py" = ["T201", "PT018", "S101"]
"tests/**/*.py" = [
    "D100",
    "D103",
    "PLR2004",
    "S101",
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25
